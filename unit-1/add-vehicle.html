<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add Vehicle - Unit 1</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <!-- Header & Navigation -->
    <header class="header">
        <div class="container navbar">
            <h1 class="logo">🚗 Vehicle Rental Management System</h1>
            <nav>
                <ul class="nav-links">
                    <li><a href="index.html">Fleet Dashboard</a></li>
                    <li><a href="add-vehicle.html" class="active">Add Vehicle</a></li>
                </ul>
            </nav>
        </div>
    </header>

    <!-- Main Content -->
    <main class="container">
        <section class="card form-card">
            <div class="card-header">
                <h2>Add Vehicle to Fleet</h2>
                <a href="index.html" class="btn btn-secondary">← Back to Fleet</a>
            </div>

            <form action="#" method="get" class="vehicle-form">
                
                <div class="form-group">
                    <label for="registrationNumber">Registration / License Plate</label>
                    <input type="text" id="registrationNumber" name="registrationNumber" placeholder="e.g. KA-01-EA-2024" required>
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label for="make">Manufacturer / Make</label>
                        <input type="text" id="make" name="make" placeholder="e.g. Toyota" required>
                    </div>

                    <div class="form-group">
                        <label for="model">Model Name</label>
                        <input type="text" id="model" name="model" placeholder="e.g. Camry Hybrid" required>
                    </div>
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label for="category">Category / Class</label>
                        <select id="category" name="category" required>
                            <option value="">-- Select Category --</option>
                            <option value="Sedan">Sedan</option>
                            <option value="SUV">SUV</option>
                            <option value="Electric">Electric</option>
                            <option value="Luxury">Luxury</option>
                            <option value="Sports">Sports</option>
                            <option value="Hatchback">Hatchback</option>
                        </select>
                    </div>

                    <div class="form-group">
                        <label for="fuelType">Fuel Type</label>
                        <select id="fuelType" name="fuelType" required>
                            <option value="">-- Select Fuel --</option>
                            <option value="Petrol">Petrol</option>
                            <option value="Diesel">Diesel</option>
                            <option value="Electric">Electric</option>
                            <option value="Hybrid">Hybrid</option>
                        </select>
                    </div>
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label for="dailyRate">Daily Rental Rate ($)</label>
                        <input type="number" id="dailyRate" name="dailyRate" step="0.5" min="10" placeholder="e.g. 65.00" required>
                    </div>

                    <div class="form-group">
                        <label for="seatingCapacity">Seating Capacity</label>
                        <select id="seatingCapacity" name="seatingCapacity">
                            <option value="2">2 Seater</option>
                            <option value="4">4 Seater</option>
                            <option value="5" selected>5 Seater</option>
                            <option value="7">7 Seater</option>
                            <option value="8">8+ Seater</option>
                        </select>
                    </div>
                </div>

                <div class="form-group">
                    <label for="mileage">Current Odometer / Mileage (km)</label>
                    <input type="number" id="mileage" name="mileage" placeholder="e.g. 15000" min="0">
                </div>

                <div class="form-actions">
                    <button type="submit" class="btn btn-primary">Save Vehicle</button>
                    <button type="reset" class="btn btn-secondary">Reset Form</button>
                </div>

            </form>
        </section>
    </main>

    <!-- Footer -->
    <footer class="footer">
        <p>© 2024 Vehicle Rental Management System | Unit 1 - Pure HTML & CSS</p>
    </footer>

</body>
</html>
